<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue au Cimetière</title>
  <!-- Typo rétro -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <!-- Ton fichier CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: monospace;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
    }
    .login-box {
      background: rgba(0,0,0,0.75);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
      width: 300px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      font-family: monospace;
    }
    button {
      background: #444;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Entre dans le cimetière</h1>
    <input type="text" id="username" placeholder="Pseudo">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="signup()">Créer un compte</button>
  </div>

  <script>
    const API_URL = 'https://backend-d2en.onrender.com';

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('Veuillez remplir tous les champs.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = 'cemetery.html';
        } else {
          alert(data.message || 'Erreur lors de la connexion.');
        }
      } catch (err) {
        alert('Erreur réseau ou serveur injoignable.');
      }
    }

    async function signup() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('Veuillez remplir tous les champs.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          alert('✅ Compte créé. Vous pouvez maintenant vous connecter.');
        } else {
          alert(data.message || 'Erreur lors de la création du compte.');
        }
      } catch (err) {
        alert('Erreur réseau ou serveur injoignable.');
      }
    }
  </script>
</body>
</html>
