<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cimetière</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0d0d0d;
      font-family: monospace;
      color: white;
    }
    canvas {
      display: block;
      cursor: grab;
      background: url("background.png") no-repeat center center;
      background-size: cover;
    }
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 14px;
      pointer-events: none;
      display: none;
      white-space: pre-line;
      z-index: 10;
    }
    .glow {
      filter: drop-shadow(0 0 6px white);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="tooltip" id="tooltip"></div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const tombSprite = new Image();
    tombSprite.src = "./tomb.png";

    const snowflakes = Array.from({ length: 100 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 1,
      d: Math.random() * 1 + 0.5
    }));

    let tombs = [
      { x: 200, y: 300, opacity: 0 },
      { x: 400, y: 500, opacity: 0 },
    ];
    let camera = { x: 0, y: 0 };
    let zoom = 1;
    const TOMBSTONE_WIDTH = 58;
    const TOMBSTONE_HEIGHT = 48;

    function drawSnow() {
      ctx.fillStyle = 'white';
      for (const flake of snowflakes) {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fill();
        flake.y += flake.d;
        if (flake.y > canvas.height) {
          flake.y = 0;
          flake.x = Math.random() * canvas.width;
        }
      }
    }

    function drawTombs(mouseX, mouseY) {
      for (const tomb of tombs) {
        if (tomb.opacity < 1) tomb.opacity += 0.02;
        const drawX = (tomb.x - camera.x) * zoom;
        const drawY = (tomb.y - camera.y) * zoom;
        const width = TOMBSTONE_WIDTH * zoom;
        const height = TOMBSTONE_HEIGHT * zoom;
        const isHovered = mouseX &&
          mouseX > drawX && mouseX < drawX + width &&
          mouseY > drawY && mouseY < drawY + height;

        ctx.save();
        ctx.globalAlpha = tomb.opacity;
        if (isHovered) {
          ctx.shadowColor = 'white';
          ctx.shadowBlur = 10;
        }
        ctx.drawImage(tombSprite, drawX, drawY, width, height);
        ctx.restore();
      }
    }

    function loop(mouseX, mouseY) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSnow();
      drawTombs(mouseX, mouseY);
      requestAnimationFrame(() => loop(currentMouse.x, currentMouse.y));
    }

    let currentMouse = { x: null, y: null };
    canvas.addEventListener("mousemove", e => {
      currentMouse.x = e.clientX;
      currentMouse.y = e.clientY;
    });

    tombSprite.onload = () => loop();
  </script>
</body>
</html>
