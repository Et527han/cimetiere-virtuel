<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cimetière</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: 'VT323', monospace;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: grab;
      background: url("background.png") no-repeat center center;
      background-size: cover;
    }
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 14px;
      pointer-events: none;
      display: none;
      white-space: pre-line;
      z-index: 10;
    }
    .modal, #createModal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .modal.show, #createModal.show {
      display: flex !important;
    }
    .modal-box, .create-box {
      background: #111;
      border: 2px solid #555;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-box button, .create-box button {
      background: #444;
      color: white;
      padding: 6px;
      border: none;
      cursor: pointer;
    }
    .modal-box button:hover, .create-box button:hover {
      background: #666;
    }
    .modal-box .share-link {
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      color: #88f;
      margin-top: 5px;
    }
    #global-count {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #111;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 99;
    }
    #rank-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #333;
      color: white;
      border: none;
      padding: 6px 12px;
      font-family: monospace;
      cursor: pointer;
      z-index: 99;
    }
    #topTombsPanel {
      position: absolute;
      top: 50px;
      right: 10px;
      width: 250px;
      background: #111;
      padding: 10px;
      border-radius: 8px;
      display: none;
      z-index: 100;
    }
    #topTombsList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }
    #topTombsList li {
      margin-bottom: 8px;
    }
    #create-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #4caf50;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
      cursor: pointer;
      z-index: 99;
    }
    .snowflake {
      position: fixed;
      top: -10px;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: fall linear infinite;
      z-index: 5;
    }
    @keyframes fall {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(100vh); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="tooltip" id="tooltip"></div>
  <div class="modal" id="reactionModal"><div class="modal-box" id="modalContent"></div></div>
  <div id="createModal"><div class="create-box">
    <input id="pseudoInput" placeholder="Ton pseudo">
    <textarea id="messageInput" placeholder="Ton message" rows="4"></textarea>
    <button onclick="submitTomb()">Laisser une tombe</button>
    <button onclick="document.getElementById('createModal').classList.remove('show')">Annuler</button>
  </div></div>
  <audio id="hoverSound" src="hover.mp3" preload="auto"></audio>
  <div id="global-count"></div>
  <button id="rank-btn" onclick="toggleRanking()">🏆 Classement</button>
  <div id="topTombsPanel"><strong>Top tombes</strong><ul id="topTombsList"></ul></div>
  <button id="create-btn" onclick="document.getElementById('createModal').classList.add('show')">+ Créer une tombe</button>

  <script>
    const API_URL = 'https://backend-d2en.onrender.com';
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const tooltip = document.getElementById("tooltip");
    const modal = document.getElementById("reactionModal");
    const modalContent = document.getElementById("modalContent");
    const hoverSound = document.getElementById("hoverSound");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const tombSprite = new Image();
    tombSprite.src = "./tomb.png";

    let tombs = [];
    let camera = { x: 0, y: 0 };
    let zoom = 1;
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    const TOMBSTONE_WIDTH = 58;
    const TOMBSTONE_HEIGHT = 48;

    function createSnowflake() {
      const flake = document.createElement('div');
      flake.className = 'snowflake';
      flake.style.left = Math.random() * window.innerWidth + 'px';
      flake.style.animationDuration = 2 + Math.random() * 3 + 's';
      flake.style.opacity = Math.random();
      flake.style.fontSize = 5 + Math.random() * 10 + 'px';
      document.body.appendChild(flake);
      setTimeout(() => flake.remove(), 5000);
    }
    setInterval(createSnowflake, 200);

    function drawTombs() {
      for (const tomb of tombs) {
        const drawX = (tomb.x - camera.x) * zoom;
        const drawY = (tomb.y - camera.y) * zoom;
        const width = TOMBSTONE_WIDTH * zoom;
        const height = TOMBSTONE_HEIGHT * zoom;
        ctx.globalAlpha = Math.min(1, (performance.now() - tomb.appearedAt) / 500);
        ctx.shadowColor = tomb.hovered ? 'white' : 'transparent';
        ctx.shadowBlur = tomb.hovered ? 10 : 0;
        ctx.drawImage(tombSprite, drawX, drawY, width, height);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawTombs();
    }

    async function loadTombsFromAPI() {
      try {
        const res = await fetch(`${API_URL}/tombs`);
        const data = await res.json();
        tombs = data.map(t => ({ ...t, appearedAt: performance.now(), hovered: false }));
        document.getElementById("global-count").innerText = `${tombs.length} tombes déposées`;
      } catch (err) {
        console.error("Erreur de chargement des tombes", err);
      }
    }

    canvas.addEventListener("mousemove", e => {
      const mx = e.clientX / zoom + camera.x;
      const my = e.clientY / zoom + camera.y;
      for (const tomb of tombs) {
        const hovered = mx > tomb.x && mx < tomb.x + TOMBSTONE_WIDTH && my > tomb.y && my < tomb.y + TOMBSTONE_HEIGHT;
        if (hovered) {
          tooltip.innerText = tomb.message;
          tooltip.style.left = e.clientX + 10 + 'px';
          tooltip.style.top = e.clientY + 10 + 'px';
          tooltip.style.display = 'block';
          if (!tomb.hovered) hoverSound.play();
          tomb.hovered = true;
          return;
        } else {
          tomb.hovered = false;
        }
      }
      tooltip.style.display = 'none';
    });

    // Autres événements : déplacement, clic, zoom, modale, etc. (comme dans ta version actuelle)

    loadTombsFromAPI();
    setInterval(loop, 1000 / 30);
  </script>
</body>
</html>
