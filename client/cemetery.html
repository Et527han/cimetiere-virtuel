<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cimetière</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'VT323', monospace;
      background-color: #0d0d0d;
      color: white;
    }
    canvas {
      display: block;
      cursor: grab;
      background: url("background.png") no-repeat center center;
      background-size: cover;
    }
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 14px;
      pointer-events: none;
      display: none;
      white-space: pre-line;
      z-index: 10;
    }
    .modal, #createModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .modal.show, #createModal.show {
      display: flex !important;
    }
    .modal-box, .create-box {
      background: #111;
      border: 2px solid #555;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-box button, .create-box button {
      background: #444;
      color: white;
      padding: 6px;
      border: none;
      cursor: pointer;
    }
    .modal-box button:hover, .create-box button:hover {
      background: #666;
    }
    .modal-box .share-link {
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      color: #88f;
      margin-top: 5px;
    }
    #global-count {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 99;
    }
    #rank-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #333;
      color: white;
      border: none;
      padding: 6px 12px;
      font-family: monospace;
      cursor: pointer;
      z-index: 99;
    }
    #topTombsPanel {
      position: absolute;
      top: 50px;
      right: 10px;
      width: 250px;
      background: #111;
      padding: 10px;
      border-radius: 8px;
      display: none;
      z-index: 100;
    }
    #topTombsList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }
    #topTombsList li {
      margin-bottom: 8px;
    }
    #create-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #4caf50;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
      cursor: pointer;
      z-index: 99;
    }
    .snowflake {
      position: fixed;
      top: -10px;
      color: white;
      font-size: 1em;
      user-select: none;
      animation: fall linear infinite;
      z-index: 50;
    }
    @keyframes fall {
      0% { transform: translateY(-10px); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="tooltip" id="tooltip"></div>
  <div class="modal" id="reactionModal"><div class="modal-box" id="modalContent"></div></div>
  <div id="createModal"><div class="create-box">
    <input id="pseudoInput" placeholder="Ton pseudo">
    <textarea id="messageInput" placeholder="Ton message" rows="4"></textarea>
    <button onclick="submitTomb()">Laisser une tombe</button>
    <button onclick="document.getElementById('createModal').classList.remove('show')">Annuler</button>
  </div></div>
  <div id="global-count"></div>
  <button id="rank-btn" onclick="toggleRanking()">🏆 Classement</button>
  <div id="topTombsPanel">
    <strong>Top tombes</strong>
    <ul id="topTombsList"></ul>
  </div>
  <button id="create-btn" onclick="document.getElementById('createModal').classList.add('show')">+ Créer une tombe</button>
  <script>
    // GÉNÉRATION DE NEIGE
    setInterval(() => {
      const snowflake = document.createElement('div');
      snowflake.className = 'snowflake';
      snowflake.textContent = '❄';
      snowflake.style.left = Math.random() * window.innerWidth + 'px';
      snowflake.style.animationDuration = (2 + Math.random() * 5) + 's';
      document.body.appendChild(snowflake);
      setTimeout(() => snowflake.remove(), 7000);
    }, 300);
  </script>
  <script src="main.js"></script>
</body>
</html>
